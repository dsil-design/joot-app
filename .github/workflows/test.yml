name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only the jest suite gates today. `npm run lint` is broken (`next lint`
      # is not a valid subcommand on this Next version) and `npm run typecheck`
      # reports pre-existing errors from stale generated Supabase types. Add
      # each here once it passes, rather than leaving a red check standing.
      - name: Run tests
        run: npm test -- --ci
