name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `npm run lint` still does not gate: `next lint` is not a valid
      # subcommand on this Next version. Add it here once it passes.
      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci

      # The main suite pins TZ=UTC, which is where date bugs hide: a
      # 'YYYY-MM-DD' string parses to UTC midnight, so reading local calendar
      # components back off it only misbehaves away from UTC. Re-run from a
      # zone west of UTC to catch that class of mistake.
      - name: Run tests from a non-UTC timezone
        run: npm run test:tz -- --ci
